<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0891b2">
  <title>Diastock – Magazzino Emodialisi</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Diastock">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="btnBack" class="icon-btn hidden" aria-label="Indietro">&#8592;</button>
    <h1 id="title">Diastock</h1>
    <span class="spacer"></span>
    <span id="status" class="badge">controllo…</span>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="home" onclick="location.hash='#home'">
      <span>🏠</span>Home
    </button>
    <button data-tab="materiali" onclick="location.hash='#materiali'">
      <span>🏷️</span>Materiali
    </button>
    <button data-tab="giacenze" onclick="location.hash='#giacenze'">
      <span>📊</span>Giacenze
    </button>
    <button data-tab="notifiche" onclick="location.hash='#notifiche'" class="rel">
      <span>🔔</span>Notifiche
      <span id="notifBadge" class="tab-badge hidden">0</span>
    </button>
    <button data-tab="menu" onclick="location.hash='#menu'">
      <span>⚙️</span>Menu
    </button>
  </nav>

  <div id="toast" class="toast"></div>
  <dialog id="dialog"></dialog>

  <!-- Librerie di supporto offline -->
  <script src="lib/supabase.js"></script>
  <script src="lib/html5-qrcode.min.js"></script>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/jspdf.plugin.autotable.min.js"></script>

  <!-- Configurazione di progetto -->
  <script src="config.js"></script>

  <!-- Moduli Applicativi -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
